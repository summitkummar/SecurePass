<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SecurePass - Password Generator</title>
    <meta name="description" content="SecurePass - Professional online password generator.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { overflow-x: hidden; }
        html, body { width: 100%; max-width: 100vw; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #050505; color: #fff; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 20px;
            position: relative; overflow-y: auto; overflow-x: hidden;
        }
        .bg-blob { position: fixed; width: 350px; height: 350px; background: linear-gradient(180deg, #38bdf8, #818cf8); border-radius: 50%; filter: blur(80px); opacity: 0.25; z-index: 0; pointer-events: none; top: -80px; left: -80px; }
        .bg-blob:nth-child(3) { background: linear-gradient(180deg, #f472b6, #fb923c); width: 280px; height: 280px; bottom: -80px; right: -80px; top: auto; left: auto; }
        .app-container { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 35px 22px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 100%; max-width: 480px; border: 1px solid rgba(255, 255, 255, 0.1); position: relative; z-index: 1; }
        .header { text-align: center; margin-bottom: 26px; }
        .header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .header p { font-size: 0.85rem; color: #94a3b8; font-weight: 500; }
        .password-display { position: relative; margin-bottom: 20px; border-radius: 20px; padding: 1.5px; background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #f472b6 100%); box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.1), 0 20px 50px -20px rgba(56, 189, 248, 0.4), 0 10px 30px -15px rgba(129, 140, 248, 0.3); transition: box-shadow 0.5s ease; }
        .password-display.active { box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4), 0 20px 60px -15px rgba(56, 189, 248, 0.7), 0 10px 40px -10px rgba(129, 140, 248, 0.6); }
        .password-inner { background: linear-gradient(180deg, #0c0c14 0%, #06060a 100%); border-radius: 19px; padding: 14px 14px 14px 20px; position: relative; overflow: hidden; }
        .password-inner::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.4), transparent); }
        .password-label { font-size: 0.65rem; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .password-label i { color: #38bdf8; font-size: 0.7rem; }
        .password-row { display: flex; align-items: center; gap: 10px; }
        #password { flex: 1; background: transparent; border: none; padding: 0; color: #ffffff; font-size: 1.3rem; outline: none; font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: 2px; min-width: 0; text-shadow: 0 0 25px rgba(56, 189, 248, 0.5); line-height: 1.4; }
        #password::selection { background: #38bdf8; color: #0a0a0f; }
        .copy-icon-btn { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0a0a0f; border: none; width: 46px; height: 46px; border-radius: 12px; cursor: pointer; font-size: 1.05rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: inherit; box-shadow: 0 4px 15px -5px rgba(56, 189, 248, 0.6); transition: transform 0.15s; }
        .copy-icon-btn:active { transform: scale(0.94); }
        .copy-icon-btn.copied { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px -5px rgba(16, 185, 129, 0.6); }
        .strength-container { margin-bottom: 24px; }
        .strength-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.08); width: 0%; transition: width 0.5s, background 0.5s; }
        .strength-text { font-size: 0.7rem; color: #94a3b8; text-align: right; margin-top: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
        .options { margin-bottom: 22px; }
        .option-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 0.92rem; color: #cbd5e1; font-weight: 500; }
        input[type="range"] { width: 55%; accent-color: #38bdf8; }
        .toggle-switch { position: relative; width: 44px; height: 24px; display: inline-block; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #38bdf8; }
        input:checked + .slider:before { transform: translateX(20px); }
        .presets { display: flex; gap: 8px; margin-bottom: 18px; }
        .presets button { flex: 1; padding: 10px 4px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #94a3b8; border-radius: 8px; font-size: 0.85rem; cursor: pointer; font-weight: 700; font-family: inherit; transition: all 0.2s; }
        .presets button.active { background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0a0a0f; border-color: transparent; }
        .generate-btn { width: 100%; background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0a0a0f; border: none; padding: 16px; border-radius: 14px; font-size: 1.05rem; font-weight: 800; cursor: pointer; font-family: inherit; letter-spacing: 0.3px; box-shadow: 0 8px 25px -10px rgba(56, 189, 248, 0.6); transition: transform 0.15s; }
        .generate-btn:active:not(:disabled) { transform: scale(0.98); }
        .generate-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; box-shadow: none; }
        .share-section { margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); }
        .share-title { text-align: center; font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px; font-weight: 600; letter-spacing: 0.3px; }
        .share-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        
        /* Share buttons - real anchor/button, no transitions, no filters */
        .share-btn { 
            width: 44px; height: 44px; 
            border-radius: 50%; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-size: 1.05rem; 
            border: none;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
            text-decoration: none;
            outline: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .share-btn:focus { outline: none; }
        
        .share-btn.whatsapp { background: #25D366; }
        .share-btn.facebook { background: #1877F2; }
        .share-btn.twitter { background: #000; border: 1px solid rgba(255,255,255,0.2); }
        .share-btn.telegram { background: #0088cc; }
        .share-btn.linkedin { background: #0A66C2; }
        .share-btn.email { background: #EA4335; }
        .share-btn.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .share-btn.copy { background: #475569; }
        
        .toast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(150px); background: #10b981; color: white; padding: 13px 24px; border-radius: 50px; font-weight: 700; font-size: 0.85rem; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); transition: transform 0.35s ease; z-index: 9999; max-width: 88%; text-align: center; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .footer { text-align: center; margin-top: 22px; font-size: 0.72rem; color: #64748b; font-weight: 500; }
    </style>
</head>
<body>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
    
    <div class="app-container">
        <div class="header">
            <h1>SecurePass</h1>
            <p>Ultra Secure Password Generator</p>
        </div>

        <div class="password-display" id="pwdDisplay">
            <div class="password-inner">
                <div class="password-label">
                    <i class="fas fa-shield-halved"></i>
                    <span>Your Secure Password</span>
                </div>
                <div class="password-row">
                    <input type="text" id="password" readonly value="Click Generate..." spellcheck="false" autocomplete="off">
                    <button class="copy-icon-btn" id="copyBtn" type="button" title="Copy Password">
                        <i class="fas fa-copy" id="copyIcon"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="strength-container">
            <div class="strength-bar" id="strength-bar"></div>
            <div class="strength-text" id="strength-text">Ready to generate</div>
        </div>
        
        <div class="options">
            <div class="option-row">
                <label>Password Length: <span id="length-val" style="color:#38bdf8; font-weight:700;">16</span></label>
                <input type="range" id="length" min="8" max="32" value="16">
            </div>
            <div class="option-row">
                <label>Uppercase (A-Z)</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="uppercase" checked>
                    <span class="slider"></span>
                </div>
            </div>
            <div class="option-row">
                <label>Lowercase (a-z)</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="lowercase" checked>
                    <span class="slider"></span>
                </div>
            </div>
            <div class="option-row">
                <label>Numbers (0-9)</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="numbers" checked>
                    <span class="slider"></span>
                </div>
            </div>
            <div class="option-row">
                <label>Symbols (!@#$)</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="symbols" checked>
                    <span class="slider"></span>
                </div>
            </div>
        </div>
        
        <div class="presets">
            <button type="button" data-len="8">8</button>
            <button type="button" data-len="16" class="active">16</button>
            <button type="button" data-len="24">24</button>
            <button type="button" data-len="32">32</button>
        </div>

        <button class="generate-btn" id="gen-btn" type="button">⚡ Generate Password</button>

        <div class="share-section">
            <div class="share-title">📢 Share SecurePass</div>
            <div class="share-grid">
                <a class="share-btn whatsapp" id="lnk-wa" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp"></i></a>
                <a class="share-btn facebook" id="lnk-fb" target="_blank" rel="noopener noreferrer"><i class="fab fa-facebook-f"></i></a>
                <a class="share-btn twitter" id="lnk-tw" target="_blank" rel="noopener noreferrer"><i class="fab fa-x-twitter"></i></a>
                <a class="share-btn telegram" id="lnk-tg" target="_blank" rel="noopener noreferrer"><i class="fab fa-telegram-plane"></i></a>
                <a class="share-btn linkedin" id="lnk-li" target="_blank" rel="noopener noreferrer"><i class="fab fa-linkedin-in"></i></a>
                <a class="share-btn email" id="lnk-em"><i class="fas fa-envelope"></i></a>
                <button class="share-btn instagram" id="btn-ig" type="button"><i class="fab fa-instagram"></i></button>
                <button class="share-btn copy" id="btn-cp" type="button"><i class="fas fa-link"></i></button>
            </div>
        </div>

        <div class="footer">Protected by SecurePass. No data is stored.</div>
    </div>

    <div class="toast" id="toast">✅ Link Copied!</div>

    <script>
        var pageUrl = window.location.href.split('?')[0].split('#')[0];
        var shareText = "🔐 SecurePass - Create strong, random & secure passwords instantly! 100% free and safe. Check it out:";
        var shareTitle = "SecurePass - Ultra Secure Password Generator";

        // ============ SET ALL SHARE URLS ON PAGE LOAD (Native anchor click - no blink) ============
        document.getElementById('lnk-wa').href = "https://wa.me/?text=" + encodeURIComponent(shareText + "\n\n" + pageUrl);
        document.getElementById('lnk-fb').href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(pageUrl);
        document.getElementById('lnk-tw').href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(shareText) + "&url=" + encodeURIComponent(pageUrl);
        document.getElementById('lnk-tg').href = "https://t.me/share/url?url=" + encodeURIComponent(pageUrl) + "&text=" + encodeURIComponent(shareText);
        document.getElementById('lnk-li').href = "https://www.linkedin.com/sharing/share-offsite/?url=" + encodeURIComponent(pageUrl);
        document.getElementById('lnk-em').href = "mailto:?subject=" + encodeURIComponent(shareTitle) + "&body=" + encodeURIComponent(shareText + "\n\n" + pageUrl);

        function showToast(msg) {
            var t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            if (window._toastTimer) clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(function() {
                t.classList.remove('show');
            }, 2800);
        }

        function copyText(text, callback) {
            var done = false;
            function finish() { if (!done) { done = true; if (callback) callback(); } }
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(finish).catch(function() {
                    fallbackCopy(text); finish();
                });
            } else {
                fallbackCopy(text); finish();
            }
        }
        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus(); ta.select();
            try { document.execCommand('copy'); } catch(e) {}
            document.body.removeChild(ta);
        }

        // Instagram - copy link + open app
        document.getElementById('btn-ig').addEventListener('click', function() {
            copyText(shareText + "\n\n" + pageUrl, function() {
                showToast("📷 Link Copied! Open Instagram to Post");
                setTimeout(function() {
                    try { window.location.href = "instagram://app"; } catch(err) {}
                }, 700);
            });
        });

        // Copy link
        document.getElementById('btn-cp').addEventListener('click', function() {
            copyText(pageUrl, function() {
                showToast("✅ Link Copied!");
            });
        });

        var pwdDisplay = document.getElementById('pwdDisplay');
        document.getElementById('copyBtn').addEventListener('click', function() {
            var pwd = document.getElementById('password').value;
            if (pwd === "Click Generate..." || pwd === "") {
                showToast("⚠️ Please generate a password first!");
                return;
            }
            var btn = this;
            var icon = document.getElementById('copyIcon');
            copyText(pwd, function() {
                btn.classList.add('copied');
                icon.className = 'fas fa-check';
                showToast("✅ Password Copied!");
                setTimeout(function() {
                    btn.classList.remove('copied');
                    icon.className = 'fas fa-copy';
                }, 2000);
            });
        });

        var slider = document.getElementById('length');
        var sliderVal = document.getElementById('length-val');
        slider.addEventListener('input', function() {
            sliderVal.innerText = this.value;
        });

        var presetBtns = document.querySelectorAll('.presets button');
        for (var i = 0; i < presetBtns.length; i++) {
            presetBtns[i].addEventListener('click', function() {
                for (var j = 0; j < presetBtns.length; j++) {
                    presetBtns[j].classList.remove('active');
                }
                this.classList.add('active');
                var len = this.getAttribute('data-len');
                slider.value = len;
                sliderVal.innerText = len;
            });
        }

        var isGenerating = false;
        var genBtn = document.getElementById('gen-btn');
        var pwdField = document.getElementById('password');
        var strengthText = document.getElementById('strength-text');
        var strengthBar = document.getElementById('strength-bar');

        genBtn.addEventListener('click', function() {
            if (isGenerating) return;
            isGenerating = true;

            genBtn.disabled = true;
            genBtn.innerText = "Generating...";
            strengthText.innerText = "Scrambling...";
            strengthText.style.color = "#f59e0b";
            strengthBar.style.width = "0%";
            pwdDisplay.classList.add('active');

            var length = parseInt(slider.value);
            var useUpper = document.getElementById('uppercase').checked;
            var useLower = document.getElementById('lowercase').checked;
            var useNumbers = document.getElementById('numbers').checked;
            var useSymbols = document.getElementById('symbols').checked;

            var charset = "";
            if (useUpper) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (useLower) charset += "abcdefghijklmnopqrstuvwxyz";
            if (useNumbers) charset += "0123456789";
            if (useSymbols) charset += "!@#$%^&*()_+~|}{[]:;?><,./-=";

            if (charset === "") {
                showToast("⚠️ Select at least one option!");
                isGenerating = false;
                genBtn.disabled = false;
                genBtn.innerText = "⚡ Generate Password";
                pwdDisplay.classList.remove('active');
                return;
            }

            var finalPassword = "";
            for (var i = 0; i < length; i++) {
                finalPassword += charset.charAt(Math.floor(Math.random() * charset.length));
            }

            var totalTime = Math.floor(Math.random() * 4000) + 3000;
            var seconds = 0;

            var scrambleInterval = setInterval(function() {
                var scrambleStr = "";
                for (var j = 0; j < length; j++) {
                    scrambleStr += charset.charAt(Math.floor(Math.random() * charset.length));
                }
                pwdField.value = scrambleStr;
            }, 50);

            var timerInterval = setInterval(function() {
                seconds++;
                strengthText.innerText = "Generating... " + seconds + "s";
            }, 1000);

            setTimeout(function() {
                clearInterval(scrambleInterval);
                clearInterval(timerInterval);
                pwdField.value = finalPassword;
                calculateStrength(finalPassword);
                strengthText.innerText = "Generated in " + seconds + "s";
                strengthText.style.color = "#10b981";
                genBtn.disabled = false;
                genBtn.innerText = "⚡ Generate Password";
                isGenerating = false;
                setTimeout(function() {
                    pwdDisplay.classList.remove('active');
                }, 1500);
            }, totalTime);
        });

        function calculateStrength(pwd) {
            var strength = 0;
            if (pwd.length >= 8) strength += 1;
            if (pwd.length >= 12) strength += 1;
            if (/[A-Z]/.test(pwd)) strength += 1;
            if (/[0-9]/.test(pwd)) strength += 1;
            if (/[^A-Za-z0-9]/.test(pwd)) strength += 1;

            if (strength <= 2) {
                strengthBar.style.width = '33%'; strengthBar.style.background = '#ef4444'; strengthText.innerText = 'WEAK';
            } else if (strength <= 4) {
                strengthBar.style.width = '66%'; strengthBar.style.background = '#f59e0b'; strengthText.innerText = 'MODERATE';
            } else {
                strengthBar.style.width = '100%'; strengthBar.style.background = '#10b981'; strengthText.innerText = 'STRONG';
            }
        }
    </script>
</body>
</html>
