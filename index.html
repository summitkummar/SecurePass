<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePass - Ultra Secure Password Generator</title>
    <meta name="description" content="SecurePass - Professional online password generator. Create strong, random, and secure passwords instantly. 100% safe, no data stored.">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #050505; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }
        .bg-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(180deg, #38bdf8, #818cf8);
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 10s infinite ease-in-out alternate;
            z-index: 0;
            pointer-events: none;
        }
        .bg-blob:nth-child(2) {
            background: linear-gradient(180deg, #f472b6, #fb923c);
            width: 300px;
            height: 300px;
            bottom: 10%;
            right: 10%;
            animation-delay: -5s;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }
        
        .app-container { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 25px; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            width: 100%; 
            max-width: 480px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .header p { font-size: 0.9rem; color: #94a3b8; font-weight: 500; }
        
        .result-box { 
            display: flex; 
            background: rgba(0, 0, 0, 0.3); 
            border-radius: 12px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }
        #password { 
            flex: 1; 
            background: transparent; 
            border: none; 
            padding: 18px; 
            color: #ffffff; 
            font-size: 1.2rem; 
            outline: none;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            min-width: 0;
        }
        .copy-btn { 
            background: transparent; 
            color: #38bdf8; 
            border: none; 
            padding: 0 20px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 0.9rem;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .strength-container { margin-bottom: 25px; }
        .strength-bar { height: 6px; border-radius: 3px; background: #333; width: 0%; transition: all 0.4s ease; }
        .strength-text { font-size: 0.75rem; color: #94a3b8; text-align: right; margin-top: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        .options { margin-bottom: 25px; }
        .option-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 0.95rem; color: #cbd5e1; font-weight: 500; }
        
        input[type="range"] { width: 55%; accent-color: #38bdf8; cursor: pointer; touch-action: manipulation; }
        
        .toggle-switch { position: relative; width: 44px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #38bdf8; }
        input:checked + .slider:before { transform: translateX(20px); }
        
        .presets { display: flex; gap: 10px; margin-bottom: 20px; }
        .presets button { flex: 1; padding: 10px 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #94a3b8; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: 600; touch-action: manipulation; }
        
        .generate-btn { 
            width: 100%; 
            background: linear-gradient(135deg, #38bdf8, #818cf8); 
            color: #0f172a; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            font-size: 1.1rem; 
            font-weight: 800; 
            cursor: pointer; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.5px;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        .generate-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }

        /* Share Section */
        .share-section { margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); }
        .share-title { text-align: center; font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; font-weight: 600; letter-spacing: 0.5px; }
        .share-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        
        .share-btn { 
            width: 46px; 
            height: 46px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-size: 1.15rem; 
            text-decoration: none;
            border: none;
            cursor: pointer;
            padding: 0;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            transition: opacity 0.15s;
        }
        .share-btn:active { opacity: 0.7; }
        
        .share-btn.whatsapp { background: #25D366; }
        .share-btn.facebook { background: #1877F2; }
        .share-btn.twitter { background: #000000; border: 1px solid rgba(255,255,255,0.2); }
        .share-btn.telegram { background: #0088cc; }
        .share-btn.linkedin { background: #0A66C2; }
        .share-btn.email { background: #EA4335; }
        .share-btn.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .share-btn.copy { background: #475569; }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            transition: transform 0.35s ease;
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        
        .footer { text-align: center; margin-top: 25px; font-size: 0.75rem; color: #64748b; font-weight: 500; }
    </style>
</head>
<body>
    <div class="bg-blob"></div>
    <div class="bg-blob"></div>
    
    <div class="app-container">
        <div class="header">
            <h1>SecurePass</h1>
            <p>Ultra Secure Password Generator</p>
        </div>

        <div class="result-box">
            <input type="text" id="password" readonly value="Click Generate...">
            <button class="copy-btn" id="copyBtn">COPY</button>
        </div>
        
        <div class="strength-container">
            <div class="strength-bar" id="strength-bar"></div>
            <div class="strength-text" id="strength-text">Ready to generate</div>
        </div>
        
        <div class="options">
            <div class="option-row">
                <label>Password Length: <span id="length-val" style="color:#38bdf8;">16</span></label>
                <input type="range" id="length" min="8" max="32" value="16">
            </div>
            <div class="option-row">
                <label>Uppercase Letters (A-Z)</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="uppercase" checked>
                    <span class="slider"></span>
                </div>
            </div>
            <div class="option-row">
                <label>Lowercase Letters (a-z)</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="lowercase" checked>
                    <span class="slider"></span>
                </div>
            </div>
            <div class="option-row">
                <label>Numbers (0-9)</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="numbers" checked>
                    <span class="slider"></span>
                </div>
            </div>
            <div class="option-row">
                <label>Symbols (!@#$)</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="symbols" checked>
                    <span class="slider"></span>
                </div>
            </div>
        </div>
        
        <div class="presets">
            <button data-len="8">8</button>
            <button data-len="16">16</button>
            <button data-len="24">24</button>
            <button data-len="32">32</button>
        </div>

        <button class="generate-btn" id="gen-btn">⚡ Generate Password</button>

        <div class="share-section">
            <div class="share-title">📢 Share SecurePass</div>
            <div class="share-grid">
                <a class="share-btn whatsapp" id="sh-wa" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i></a>
                <a class="share-btn facebook" id="sh-fb" target="_blank" rel="noopener"><i class="fab fa-facebook-f"></i></a>
                <a class="share-btn twitter" id="sh-tw" target="_blank" rel="noopener"><i class="fab fa-x-twitter"></i></a>
                <a class="share-btn telegram" id="sh-tg" target="_blank" rel="noopener"><i class="fab fa-telegram-plane"></i></a>
                <a class="share-btn linkedin" id="sh-li" target="_blank" rel="noopener"><i class="fab fa-linkedin-in"></i></a>
                <a class="share-btn email" id="sh-em"><i class="fas fa-envelope"></i></a>
                <button class="share-btn instagram" id="sh-ig"><i class="fab fa-instagram"></i></button>
                <button class="share-btn copy" id="sh-cp"><i class="fas fa-link"></i></button>
            </div>
        </div>

        <div class="footer">Protected by SecurePass. No data is stored.</div>
    </div>

    <div class="toast" id="toast">✅ Link Copied!</div>

    <script>
        // ============ SHARE LINKS SETUP ============
        const pageUrl = window.location.href.split('?')[0].split('#')[0];
        const shareText = "🔐 SecurePass - Create strong, random & secure passwords instantly! 100% free and safe. Check it out:";
        const shareTitle = "SecurePass - Ultra Secure Password Generator";

        document.getElementById('sh-wa').href = "https://wa.me/?text=" + encodeURIComponent(shareText + "\n\n" + pageUrl);
        document.getElementById('sh-fb').href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(pageUrl);
        document.getElementById('sh-tw').href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(shareText) + "&url=" + encodeURIComponent(pageUrl);
        document.getElementById('sh-tg').href = "https://t.me/share/url?url=" + encodeURIComponent(pageUrl) + "&text=" + encodeURIComponent(shareText);
        document.getElementById('sh-li').href = "https://www.linkedin.com/sharing/share-offsite/?url=" + encodeURIComponent(pageUrl);
        document.getElementById('sh-em').href = "mailto:?subject=" + encodeURIComponent(shareTitle) + "&body=" + encodeURIComponent(shareText + "\n\n" + pageUrl);

        // ============ TOAST ============
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
        }

        // ============ INSTAGRAM (Copy + Open) ============
        document.getElementById('sh-ig').addEventListener('click', function() {
            const textToCopy = shareText + "\n\n" + pageUrl;
            copyTextToClipboard(textToCopy).then(() => {
                showToast("📷 Link Copied! Open Instagram to Post");
                // Try to open Instagram app after short delay
                setTimeout(() => {
                    window.location.href = "instagram://app";
                }, 800);
            });
        });

        // ============ COPY LINK ============
        document.getElementById('sh-cp').addEventListener('click', function() {
            copyTextToClipboard(pageUrl).then(() => {
                showToast("✅ Link Copied!");
            });
        });

        // ============ COPY PASSWORD ============
        document.getElementById('copyBtn').addEventListener('click', function() {
            const pwd = document.getElementById('password').value;
            if (pwd === "Click Generate..." || pwd === "") {
                showToast("⚠️ Please generate a password first!");
                return;
            }
            copyTextToClipboard(pwd).then(() => {
                const btn = this;
                const originalText = btn.innerText;
                btn.innerText = 'COPIED!';
                btn.style.color = '#10b981';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.color = '#38bdf8';
                }, 2000);
            });
        });

        // ============ UNIVERSAL COPY FUNCTION ============
        function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
            } else {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                } catch(e) {}
                document.body.removeChild(textarea);
                return Promise.resolve();
            }
        }

        // ============ LENGTH SLIDER ============
        const lengthSlider = document.getElementById('length');
        const lengthVal = document.getElementById('length-val');
        lengthSlider.addEventListener('input', function() {
            lengthVal.innerText = this.value;
        });

        document.querySelectorAll('.presets button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const len = this.getAttribute('data-len');
                lengthSlider.value = len;
                lengthVal.innerText = len;
            });
        });

        // ============ GENERATE PASSWORD ============
        let isGenerating = false;
        const genBtn = document.getElementById('gen-btn');
        const pwdField = document.getElementById('password');
        const strengthText = document.getElementById('strength-text');
        const strengthBar = document.getElementById('strength-bar');

        genBtn.addEventListener('click', function() {
            if (isGenerating) return;
            isGenerating = true;

            genBtn.disabled = true;
            genBtn.innerText = "Generating...";
            strengthText.innerText = "Scrambling...";
            strengthText.style.color = "#f59e0b";
            strengthBar.style.width = "0%";
            strengthBar.style.background = "transparent";

            const length = parseInt(lengthSlider.value);
            const useUpper = document.getElementById('uppercase').checked;
            const useLower = document.getElementById('lowercase').checked;
            const useNumbers = document.getElementById('numbers').checked;
            const useSymbols = document.getElementById('symbols').checked;

            let charset = "";
            if (useUpper) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (useLower) charset += "abcdefghijklmnopqrstuvwxyz";
            if (useNumbers) charset += "0123456789";
            if (useSymbols) charset += "!@#$%^&*()_+~`|}{[]:;?><,./-=";

            if (charset === "") {
                alert("Please select at least one option!");
                isGenerating = false;
                genBtn.disabled = false;
                genBtn.innerText = "⚡ Generate Password";
                return;
            }

            let finalPassword = "";
            for (let i = 0; i < length; i++) {
                finalPassword += charset.charAt(Math.floor(Math.random() * charset.length));
            }

            const totalTime = Math.floor(Math.random() * 4000) + 3000;
            let seconds = 0;

            const scrambleInterval = setInterval(function() {
                let scrambleStr = "";
                for (let i = 0; i < length; i++) {
                    scrambleStr += charset.charAt(Math.floor(Math.random() * charset.length));
                }
                pwdField.value = scrambleStr;
            }, 50);

            const timerInterval = setInterval(function() {
                seconds++;
                strengthText.innerText = "Generating... " + seconds + "s";
            }, 1000);

            setTimeout(function() {
                clearInterval(scrambleInterval);
                clearInterval(timerInterval);
                pwdField.value = finalPassword;
                calculateStrength(finalPassword);
                strengthText.innerText = "Generated in " + seconds + "s";
                strengthText.style.color = "#10b981";
                genBtn.disabled = false;
                genBtn.innerText = "⚡ Generate Password";
                isGenerating = false;
            }, totalTime);
        });

        function calculateStrength(pwd) {
            let strength = 0;
            if (pwd.length >= 8) strength += 1;
            if (pwd.length >= 12) strength += 1;
            if (/[A-Z]/.test(pwd)) strength += 1;
            if (/[0-9]/.test(pwd)) strength += 1;
            if (/[^A-Za-z0-9]/.test(pwd)) strength += 1;

            if (strength <= 2) {
                strengthBar.style.width = '33%'; strengthBar.style.background = '#ef4444'; strengthText.innerText = 'WEAK';
            } else if (strength <= 4) {
                strengthBar.style.width = '66%'; strengthBar.style.background = '#f59e0b'; strengthText.innerText = 'MODERATE';
            } else {
                strengthBar.style.width = '100%'; strengthBar.style.background = '#10b981'; strengthText.innerText = 'STRONG';
            }
        }
    </script>
</body>
</html>
